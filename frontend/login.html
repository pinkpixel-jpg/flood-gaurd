<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — FloodGuard Pune</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
.login-wrap{
  display:flex;justify-content:center;align-items:center;
  min-height:calc(100vh - 140px);padding:40px 20px;
}
.login-card{
  width:100%;max-width:400px;
  border:1px solid var(--line);border-radius:14px;
  background:rgba(255,255,255,0.02);
  padding:36px 32px 32px;
}
.login-card h2{margin:0 0 6px;font-size:1.4em;font-weight:700}
.login-card .sub{color:var(--text-2);font-size:.88em;margin-bottom:28px;line-height:1.5}
.field{margin-bottom:18px}
.field label{display:block;font-size:.82em;color:var(--text-3);margin-bottom:6px;font-weight:500}
.field input,.field select{
  width:100%;padding:11px 14px;
  background:var(--bg-2);border:1px solid var(--line);border-radius:8px;
  color:var(--text);font-size:.95em;box-sizing:border-box;
  transition:border-color .2s;
}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent)}
.login-card .btn{
  width:100%;padding:13px;font-size:1em;font-weight:700;
  border:none;border-radius:8px;cursor:pointer;
  background:var(--accent);color:#18211F;margin-top:6px;
  transition:opacity .2s;
}
.login-card .btn:hover{opacity:.9}
.login-card .hint{
  font-size:.8em;color:var(--text-3);margin-top:20px;
  line-height:1.6;padding-top:16px;border-top:1px solid var(--line);
}
.login-card .hint b{color:var(--text-2)}
.login-brand{text-align:center;margin-bottom:32px}
.login-brand .drop-anim{
  width:56px;height:auto;margin:0 auto 14px;
  opacity:0;transform:translateY(-40px) scale(0.6);
  animation:dropIn .8s ease-out .3s forwards;
}
@keyframes dropIn{
  0%{opacity:0;transform:translateY(-40px) scale(0.6)}
  60%{opacity:1;transform:translateY(6px) scale(1.05)}
  80%{transform:translateY(-3px) scale(0.98)}
  100%{opacity:1;transform:translateY(0) scale(1)}
}
.login-brand h1{font-size:1.6em;margin:0 0 4px;opacity:0;animation:fadeUp .6s ease-out .6s forwards}
.login-brand p{color:var(--text-2);font-size:.85em;margin:0;opacity:0;animation:fadeUp .6s ease-out .75s forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.login-card{opacity:0;animation:fadeUp .6s ease-out .9s forwards}
.login-card .hint{opacity:0;animation:fadeUp .5s ease-out 1.2s forwards}
</style>
</head>
<body data-page="login">
<a class="skip-link" href="#main">Skip to content</a>

<div id="curtain"><span class="curtain-mark mono">FloodGuard · Pune</span></div>
<div class="bg-stack" aria-hidden="true">
  <canvas id="bg3d"></canvas>
  <div class="bg-grid"></div>
  <div class="vignette"></div>
</div>

<header class="site-header">
  <a class="brand" href="login.html" aria-label="FloodGuard home">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 100 128"><path d="M50 4 C58 26 90 54 90 84 A40 40 0 1 1 10 84 C10 54 42 26 50 4 Z" fill="none" stroke="#FFD166" stroke-width="7"/></svg>
    </span>
    <span>
      <span class="brand-name">Flood<b>Guard</b></span>
      <span class="brand-sub mono">Pune · Flood Intelligence</span>
    </span>
  </a>
</header>

<main id="main">
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-brand">
        <svg class="drop-anim" viewBox="0 0 100 128"><path d="M50 4 C58 26 90 54 90 84 A40 40 0 1 1 10 84 C10 54 42 26 50 4 Z" fill="none" stroke="#FFD166" stroke-width="7"/></svg>
        <h1>FloodGuard</h1>
        <p>Pune Flood Intelligence</p>
      </div>
      <form id="fg-login-form">
        <div class="field">
          <label for="fg-user">Username</label>
          <input id="fg-user" required placeholder="Enter username" autocomplete="username">
        </div>
        <div class="field">
          <label for="fg-pass">Password</label>
          <input id="fg-pass" type="password" required placeholder="Enter password" autocomplete="current-password">
        </div>
        <div class="field">
          <label for="fg-role">Sign in as</label>
          <select id="fg-role">
            <option value="public">PUBLIC — Citizen</option>
            <option value="municipal">MUNICIPAL — Corporation</option>
          </select>
        </div>
        <button class="btn" type="submit">Sign In</button>
      </form>
      <p class="hint">
        PUBLIC: <b>citizen</b> / <b>citizen-demo</b><br>
        MUNICIPAL: <b>municipal</b> / <b>municipal-demo</b>
      </p>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="footer-base" style="max-width:none">
    <span class="mono">© <span class="js-year">2026</span> FloodGuard AI · Pune</span>
  </div>
</footer>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
<script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="js/api.js"></script>
<script src="js/background.js"></script>
<script src="js/main.js"></script>
<script>
(function(){
  var token = localStorage.getItem("fg_token");
  var role = localStorage.getItem("fg_role");
  if (token && role) { window.location.href = "live-map.html"; return; }

  document.getElementById("fg-login-form").addEventListener("submit", async function(e) {
    e.preventDefault();
    var u = document.getElementById("fg-user").value;
    var p = document.getElementById("fg-pass").value;
    var role = document.getElementById("fg-role").value;
    try {
      var res = role === "municipal"
        ? await FGApi.loginMunicipal(u, p)
        : await FGApi.loginPublic(u, p);
      localStorage.setItem("fg_token", res.access_token);
      localStorage.setItem("fg_role", res.role);
      localStorage.setItem("fg_user", res.username);
      window.location.href = "live-map.html";
    } catch (err) {
      showToast("Login failed: " + err.message);
    }
  });
})();
</script>
</body>
</html>
